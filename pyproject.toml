[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devagent"
version = "3.0.0"
description = "DevAgent: Unified LLM-based Software Engineering Agent"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "DevAgent Team"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.104.0", "uvicorn>=0.24.0", "pydantic>=2.0.0", "websockets>=12.0"]
lsp = ["pygls>=1.3.0"]
benchmark = ["pytest>=7.0.0"]
all = [
    "fastapi>=0.104.0", "uvicorn>=0.24.0", "pydantic>=2.0.0",
    "websockets>=12.0", "pygls>=1.3.0", "pytest>=7.0.0",
]

[project.scripts]
agent = "devagent.cli.main:main"
devagent = "devagent.cli.main:main"
devagent-api = "devagent.api.app:run_server"
devagent-lsp = "devagent.lsp.server:main"

[tool.setuptools.packages.find]
include = ["devagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
