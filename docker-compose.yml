# ============================================================================
# DevAgent v3.4 — Docker Compose
# ============================================================================
# Quick Start:
#   1. cp .env.example .env  →  fill in your API keys
#   2. docker compose up -d
#   3. Open http://localhost:8911/dashboard
#
# CLI Usage (inside container):
#   docker compose exec devagent agent --mode full -i /app/example/requirements.md
#
# Full options:
#   docker compose --profile sandbox up -d   (enable Docker-in-Docker sandbox)
#   docker compose --profile eval up -d      (enable evaluation tools)
# ============================================================================

services:
  # =====================================================
  # DevAgent API Server
  # =====================================================
  devagent:
    build:
      context: .
      dockerfile: Dockerfile
    image: devagent:3.4
    container_name: devagent
    ports:
      - "8911:8911"
    env_file:
      - .env
    environment:
      # Override these via .env or docker compose -e
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Default provider = deepseek
      - DEVAGENT_DEFAULT_PROVIDER=${DEVAGENT_DEFAULT_PROVIDER:-deepseek}
    volumes:
      # Persistent outputs (generated projects, reports, diagrams)
      - devagent_outputs:/app/outputs
      # Persistent agent state (checkpoints, experience library)
      - devagent_data:/app/.devagent
      # Mount custom requirements files (optional)
      - ./example:/app/example:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8911/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =====================================================
  # Optional: Nginx reverse proxy (for production)
  # =====================================================
  nginx:
    image: nginx:alpine
    container_name: devagent-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      devagent:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - proxy

  # =====================================================
  # Optional: Docker-in-Docker sandbox (isolated execution)
  # =====================================================
  sandbox:
    image: docker:27-dind
    container_name: devagent-sandbox
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    volumes:
      - devagent_sandbox_data:/var/lib/docker
    restart: unless-stopped
    profiles:
      - sandbox

volumes:
  devagent_outputs:
  devagent_data:
  devagent_sandbox_data:
